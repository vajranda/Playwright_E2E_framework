name: Playwright Tests

on:
  push:
    branches: [ "main" ,"master"]
  pull_request:
    branches: [ "main", "master" ]

  workflow_dispatch:
    inputs:

      browser:
        description: "Select browser"
        required: true
        default: "chrome"
        type: choice
        options:
          - chrome
          - firefox
          - webkit

      environment:
        description: "Select environment"
        required: true
        default: "qa"
        type: choice
        options:
          - qa
          - dev
          - -prod




jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Install Playwright browsers
        run: mvn exec:java -e -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps"

      - name: Run Smoke Tests
        run: mvn test -Psmoke -Dbrowser=${{ github.event.inputs.browser }} -Denv=${{ github.event.inputs.environment }}